<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Josephus Protocol</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="obsidian-container">
      <header class="aurum-header">
        <h1 class="title-primary">JOSEPHUS PROTOCOL</h1>
        <p class="subtitle-secondary">Deterministic Survivor Computation</p>
      </header>
      <section class="input-panel glass-surface">
        <div class="input-group">
          <label for="n-input" class="label-text">Prisoners (n)</label>
          <input
            type="number"
            id="n-input"
            class="input-field"
            value="41"
            min="1"
          />
        </div>
        <div class="input-group">
          <label for="k-input" class="label-text">Step (k)</label>
          <input
            type="number"
            id="k-input"
            class="input-field"
            value="3"
            min="1"
          />
        </div>
        <button id="compute-btn" class="btn-exec">EXECUTE</button>
      </section>
      <section class="output-panel glass-surface">
        <h2 class="output-title">Survivor Index</h2>
        <div id="result-display" class="result-value">--</div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
